<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control T2L</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Control T2L">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg1:#f5f5f7; --bg2:#e8e8ed; --card:rgba(255,255,255,.72); --text:#1d1d1f; --muted:#6e6e73;
  --line:rgba(0,0,0,.08); --accent:#0071e3; --field:rgba(255,255,255,.9); --shadow:0 20px 60px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){
  :root{ --bg1:#000; --bg2:#1c1c1e; --card:rgba(44,44,46,.65); --text:#f5f5f7; --muted:#98989d;
    --line:rgba(255,255,255,.12); --accent:#2997ff; --field:rgba(60,60,63,.8); --shadow:0 20px 60px rgba(0,0,0,.6); }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:radial-gradient(1200px 700px at 15% 10%,rgba(0,113,227,.18),transparent 60%),
             radial-gradient(900px 600px at 90% 90%,rgba(175,82,222,.16),transparent 60%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.screen{min-height:100%;display:none;align-items:center;justify-content:center;padding:24px;animation:fade .5s ease}
.screen.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* LOGIN */
.login{
  width:100%;max-width:380px;padding:44px 32px 32px;border-radius:32px;text-align:center;
  background:var(--card);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.logo{width:76px;height:76px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;font-size:38px;
  background:linear-gradient(145deg,#0a84ff,#5e5ce6);box-shadow:0 8px 24px rgba(10,132,255,.4)}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:15px;margin:6px 0 26px}
input{
  width:100%;padding:15px 16px;margin-bottom:10px;border-radius:14px;border:1px solid var(--line);
  background:var(--field);color:var(--text);font-size:17px;outline:none;font-family:inherit;transition:box-shadow .2s,border-color .2s;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
button.primary{
  width:100%;margin-top:8px;padding:15px;border:0;border-radius:14px;background:var(--accent);color:#fff;
  font-size:17px;font-weight:500;cursor:pointer;font-family:inherit;transition:transform .15s,opacity .2s;
}
button.primary:active{transform:scale(.98)}
button.primary:disabled{opacity:.6}
.error{color:#ff453a;font-size:14px;min-height:20px;margin-top:12px}
.foot{color:var(--muted);font-size:12px;margin-top:20px}

/* LANZADOR */
#home{flex-direction:column;justify-content:flex-start;padding-top:48px}
.top{width:100%;max-width:880px;display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;gap:12px}
.top h2{font-size:30px;font-weight:600;letter-spacing:-.02em}
.top p{color:var(--muted);font-size:15px;margin-top:4px}
button.ghost{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 18px;border-radius:999px;
  font-size:14px;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-family:inherit}
.grid{width:100%;max-width:880px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:30px 18px}
.app{background:none;border:0;cursor:pointer;color:var(--text);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none}
.icon{width:88px;height:88px;border-radius:22px;display:grid;place-items:center;font-size:42px;
  box-shadow:0 8px 20px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.app:hover .icon{transform:scale(1.08);box-shadow:0 14px 30px rgba(0,0,0,.28)}
.app:active .icon{transform:scale(.95)}
.app span{font-size:13px;font-weight:500;text-align:center;line-height:1.25;max-width:110px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--card);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);
  padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<!-- PANTALLA 1: LOGIN -->
<main id="login" class="screen active">
  <div class="login">
    <div class="logo">⚖️</div>
    <h1>Control T2L</h1>
    <p class="sub">Tribunal Segundo Laboral</p>
    <input id="user" type="text" placeholder="Usuario" autocomplete="username" autocapitalize="none" autocorrect="off">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="enter" class="primary">Entrar</button>
    <div id="err" class="error"></div>
    <div class="foot">controlt2l.com</div>
  </div>
</main>

<!-- PANTALLA 2: APPS -->
<main id="home" class="screen">
  <div class="top">
    <div><h2>Mis apps</h2><p id="who"></p></div>
    <button id="out" class="ghost">Cerrar sesión</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
/* ============ CONFIGURA AQUÍ ============ */
const SUPABASE_URL  = "https://zviekbzyhkuvqyvptjsl.supabase.co";
const SUPABASE_ANON = "sb_publishable_5XUdCnrdmHV0XuGDgHmH-A_MGyk9DtE";
const DOMINIO_USUARIO = "controlt2l.com"; // si escribes "juan" entra como juan@controlt2l.com

// Agrega o quita apps aquí. "url" = página a abrir (déjala vacía si aún no existe).
const APPS = [
  { nombre:"Préstamo de expedientes", emoji:"📁", color:["#0a84ff","#5e5ce6"], url:"" },
  { nombre:"Amparos",                 emoji:"🛡️", color:["#ff9f0a","#ff453a"], url:"" },
  { nombre:"Audiencias",              emoji:"🗓️", color:["#30d158","#0a9d8f"], url:"" },
  { nombre:"Notificaciones",          emoji:"📬", color:["#bf5af2","#5e5ce6"], url:"" },
  { nombre:"Promociones",             emoji:"📝", color:["#ff375f","#ff9f0a"], url:"" },
  { nombre:"Reportes",                emoji:"📊", color:["#64d2ff","#0a84ff"], url:"" }
];
/* ======================================== */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = id => document.getElementById(id);

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}
function renderApps(){
  $("grid").innerHTML="";
  APPS.forEach(a=>{
    const el=document.createElement(a.url?"a":"button");
    el.className="app";
    if(a.url) el.href=a.url; else el.onclick=()=>toast(a.nombre+": próximamente");
    const ic=document.createElement("div");
    ic.className="icon"; ic.textContent=a.emoji;
    ic.style.background=`linear-gradient(145deg,${a.color[0]},${a.color[1]})`;
    const sp=document.createElement("span"); sp.textContent=a.nombre;
    el.append(ic,sp); $("grid").append(el);
  });
}
function enterHome(session){
  $("who").textContent = session.user.email;
  renderApps(); show("home");
}

async function login(){
  const btn=$("enter"), err=$("err"); err.textContent="";
  let u=$("user").value.trim(); const p=$("pass").value;
  if(!u||!p){ err.textContent="Escribe tu usuario y contraseña."; return; }
  if(!u.includes("@")) u=`${u}@${DOMINIO_USUARIO}`;
  btn.disabled=true; btn.textContent="Entrando…";
  const { data, error } = await sb.auth.signInWithPassword({ email:u, password:p });
  btn.disabled=false; btn.textContent="Entrar";
  if(error){ err.textContent="Usuario o contraseña incorrectos."; return; }
  $("pass").value=""; enterHome(data.session);
}

$("enter").onclick=login;
$("pass").addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });
$("user").addEventListener("keydown",e=>{ if(e.key==="Enter") $("pass").focus(); });
$("out").onclick=async()=>{ await sb.auth.signOut(); show("login"); };

// Si ya hay sesión guardada, salta directo a las apps
sb.auth.getSession().then(({data})=>{ if(data.session) enterHome(data.session); });
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT") show("login"); });
</script>
</body>
</html>
